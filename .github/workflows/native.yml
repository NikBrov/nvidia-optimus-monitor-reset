name: Build and test native GPU Manager
on:
  push:
  pull_request:
jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build GpuManager.sln -c Release
      - name: Verify policy, migration, preferences and battery state machine
        run: dotnet run --project tests/GpuManager.Tests/GpuManager.Tests.csproj -c Release --no-build
      - name: Package standalone Windows executables
        shell: powershell
        run: ./scripts/Build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: GpuManager-v7-win-x64
          path: artifacts/GpuManager-v7-win-x64.zip
